name: CodeQL Deep Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Escaneo semanal todos los lunes a las 06:00 UTC para detectar nuevas vulnerabilidades
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: "CodeQL SAST (JavaScript / TypeScript)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL (security-and-quality suite)
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Perform CodeQL SAST Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
