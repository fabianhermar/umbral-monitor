name: CI & Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Permisos mínimos de solo lectura (principio de mínimo privilegio)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-and-types:
    name: "1. Supply Chain Audit, Types & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for high/critical CVEs
        run: pnpm audit --audit-level=high

      - name: Strict TypeScript verification (Worker & Web)
        run: pnpm typecheck

      - name: Production bundle build
        run: pnpm build

  security-and-unit-suite:
    name: "2. Security, Crypto, Anti-SSRF & SAST Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest security & integration suites
        run: pnpm test

  wrangler-d1-e2e:
    name: "3. Live Cloudflare Worker + D1 SQLite E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [supply-chain-and-types, security-and-unit-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static SPA assets
        run: pnpm build

      - name: Apply D1 SQLite migrations locally
        run: pnpm db:migrate:local

      - name: Execute full Private + Demo E2E security suite on workerd
        run: pnpm test:e2e
